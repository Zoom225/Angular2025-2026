<section class="space-y-6">
  <header class="text-center space-y-2">
    <h1 class="text-2xl md:text-3xl font-bold text-slate-800">
      Bienvenue sur le catalogue de formations
    </h1>
    <p class="text-slate-600 text-sm md:text-base">
      Recherchez une formation par titre ou par tag, et consultez les prochaines dates.
    </p>
  </header>

  <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col md:flex-row gap-4">
    <div class="flex-1">
      <label class="block text-xs font-medium text-slate-500 mb-1">Titre</label>
      <input [(ngModel)]="searchTitle"
             type="text"
             class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
             placeholder="Ex : Angular, Tailwind...">
    </div>
    <div class="flex-1">
      <label class="block text-xs font-medium text-slate-500 mb-1">Tag</label>
      <input [(ngModel)]="searchTag"
             type="text"
             class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
             placeholder="Ex : Angular, CSS...">
    </div>
    <div class="flex items-end">
      <button type="button"
              (click)="goToCatalog()"
              class="w-full md:w-auto px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700">
        Voir le catalogue
      </button>
    </div>
  </div>

  <section class="space-y-3">
    <h2 class="text-lg font-semibold text-slate-800">Prochaines formations</h2>
    <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
      <app-formation-card
        *ngFor="let f of upcoming()"
        [formation]="f"
        [showActions]="true">
      </app-formation-card>
    </div>
  </section>
</section>
