<section class="space-y-4 max-w-lg">
  <h1 class="text-xl font-semibold text-slate-800">Profil utilisateur</h1>

  <form (ngSubmit)="save()"
        class="bg-white border border-slate-200 rounded-xl shadow-sm p-4 space-y-3">

    <div class="grid md:grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Prénom</label>
        <input [(ngModel)]="model.firstName" name="firstName"
               class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Nom</label>
        <input [(ngModel)]="model.lastName" name="lastName"
               class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
      </div>
    </div>

    <div>
      <label class="block text-xs font-medium text-slate-500 mb-1">Email</label>
      <input [(ngModel)]="model.email" name="email" type="email"
             class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
    </div>

    <div>
      <label class="block text-xs font-medium text-slate-500 mb-1">Date de naissance</label>
      <input [(ngModel)]="model.birthDate" name="birthDate" type="date"
             class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
    </div>

    <div>
      <label class="block text-xs font-medium text-slate-500 mb-1">Adresse</label>
      <input [(ngModel)]="model.address" name="address"
             class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
    </div>

    <div>
      <label class="block text-xs font-medium text-slate-500 mb-1">Rôle</label>
      <input [value]="userSignal().role"
             disabled
             class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-slate-50 text-slate-500">
      <p class="mt-1 text-[11px] text-slate-500">
        Utilisez le bouton dans le menu pour passer en mode admin / user.
      </p>
    </div>

    <div class="pt-2 flex justify-end">
      <button type="submit"
              class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium">
        Enregistrer
      </button>
    </div>
  </form>
</section>
